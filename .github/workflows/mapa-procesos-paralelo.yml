name: "Paso 3 — Mapa de Procesos (paralelo)"

# Úsalo si tu modelo de ciclo de vida SÍ tiene procesos que ocurren en
# paralelo (dos o más ramas de trabajo simultáneas que luego se unen).
# Si tu modelo es de flujo único, usa en su lugar
# "mapa-procesos-flujo-unico.yml".
#
# ESTRUCTURA DE ESTE WORKFLOW: Requisitos (raíz, secuencial) -> dos
# ramas que corren en paralelo (Hardware/Firmware y Software/Backend)
# -> Integración y despliegue (une ambas ramas y cierra el flujo). Es
# un modelo híbrido secuencial-paralelo-secuencial: antes de dividir el
# trabajo en paralelo, hace falta un proceso de Requisitos compartido
# por ambas ramas; y después de que ambas terminan, hace falta un
# proceso que las integre. Ni todo el ciclo de vida es paralelo, ni
# todo es secuencial — este ejemplo muestra cómo combinar ambos con
# "needs:".
#
# EJEMPLO DE ESTE WORKFLOW: un proyecto IoT típico tiene una rama de
# Hardware/Firmware y una rama de Software/Backend que un equipo
# desarrolla de forma simultánea, no secuencial — nadie espera a que el
# firmware esté terminado para empezar el backend. Por eso es un caso
# natural de procesos en paralelo, a diferencia del flujo único (donde
# un proceso sí depende de que el anterior termine).
#
# Fíjate que las dos ramas de este ejemplo NO tienen el mismo largo (la
# de Hardware tiene 3 procesos, la de Software tiene 2) — eso es
# intencional: las ramas en paralelo no tienen por qué tardar lo mismo
# ni tener la misma cantidad de procesos, solo deben unirse al final o
# en algún punto.
#
# NOTA CONCEPTUAL: que dos jobs corran "en paralelo" en este workflow
# significa que no hay una condición de carrera entre ellos sobre un
# mismo archivo — no significa que los equipos de Hardware y Software no
# se coordinen en la vida real. Por ejemplo, el proceso de Software que
# monta la API de ingesta necesita saber qué protocolo de comunicación
# usa el firmware para construir el endpoint correcto — esa es una
# decisión de diseño que el equipo acuerda al principio del proyecto,
# no una dependencia de CI entre los dos jobs. Por eso ambas ramas
# dependen únicamente de "requisitos", y no una de la otra.
#
# No hay jobs de "plumbing": el proceso de Requisitos crea el documento
# de consolidación Y agrega su propia información (en steps separados);
# el primer proceso de cada rama crea el documento de esa rama Y agrega
# su propia información (también en steps separados); el job de
# Integración y despliegue, además de unir ambas ramas al documento de
# consolidación ya creado por Requisitos, agrega su propia información
# DESPUÉS de unirlas, y recién ahí hace el commit/push. Sí, esto mezcla
# la responsabilidad de "consolidar" con la de "ser un proceso más" —
# es una decisión deliberada para que el grafo de Actions se vea fiel
# al flujo de procesos real del proyecto, sin jobs intermedios que no
# aporten información.
#
# Cómo adaptarlo a tu propio modelo: reemplaza los procesos de ejemplo
# de cada rama por los tuyos, renombra los artifacts/archivos si tus
# ramas no son "hardware" y "software", y ajusta los "needs:" según el
# orden real de cada rama. Se dispara solo manualmente.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # -----------------------------------------------------------------
  # Proceso raíz: crea el documento de consolidación (con su
  # encabezado) en un step, y agrega su propia información en otro
  # step, independiente. De este proceso dependen ambas ramas.
  # -----------------------------------------------------------------
  requisitos:
    name: "Requisitos"
    runs-on: ubuntu-latest
    steps:
      - name: Crear documento de consolidación
        run: |
          mkdir -p docs
          cat <<'EOF' > docs/mapa-procesos.md
          # Mapa de Procesos y Modelo de Ciclo de Vida

          > Generado con el workflow paralelo: Requisitos se ejecuta primero;
          > luego la rama de Hardware/Firmware (3 procesos) y la rama de
          > Software/Backend (2 procesos) se ejecutan de forma simultánea; al
          > final, Integración y despliegue une ambas ramas a este documento.
          > La definición formal del modelo de ciclo de vida se documenta en
          > la wiki, página `04c-Modelo-Ciclo-Vida`, no en este archivo.

          EOF
      - name: Agregar este proceso al documento
        run: |
          cat <<'EOF' >> docs/mapa-procesos.md
          ## Proceso: Requisitos

          - **Entradas:** Modelo verbal extendido, necesidades de negocio e interesados
          - **Actividades:** Elicitación, análisis y especificación de requisitos, tanto para el dispositivo (Hardware) como para la plataforma (Software)
          - **Salidas:** Documento de especificación de requisitos
          - **Recursos:** BABOK v3, entrevistas/supuestos del equipo

          EOF
      - name: Subir artifact
        uses: actions/upload-artifact@v4
        with:
          name: mapa-procesos
          path: docs/mapa-procesos.md
          overwrite: true

  # ===================================================================
  # RAMA HARDWARE / FIRMWARE — 3 procesos. El primero depende de
  # "requisitos" y crea el documento de su propia rama.
  # ===================================================================
  rama_hardware_diseno:
    name: "Diseño de hardware"
    needs: requisitos
    runs-on: ubuntu-latest
    steps:
      - name: Crear documento de la rama
        run: |
          mkdir -p docs
          cat <<'EOF' > docs/mapa-procesos-rama-hardware.md
          ## Rama Hardware / Firmware

          EOF
      - name: Agregar este proceso
        run: |
          cat <<'EOF' >> docs/mapa-procesos-rama-hardware.md
          ### Proceso: Diseño de hardware y selección de componentes

          - **Entradas:** Requisitos funcionales de sensado/actuación; restricciones de consumo energético y costo
          - **Actividades:** Selección de sensores y actuadores, diseño del esquemático y la PCB, definición de la arquitectura eléctrica del dispositivo
          - **Salidas:** Esquemático aprobado, lista de materiales (BOM), prototipo de placa
          - **Recursos:** Software de diseño electrónico (KiCad/Altium), catálogo de componentes, datasheets de fabricantes

          EOF
      - name: Subir artifact
        uses: actions/upload-artifact@v4
        with:
          name: mapa-procesos-rama-hardware
          path: docs/mapa-procesos-rama-hardware.md
          overwrite: true

  rama_hardware_firmware:
    name: "Desarrollo de firmware"
    needs: rama_hardware_diseno
    runs-on: ubuntu-latest
    steps:
      - name: Descargar artifact
        uses: actions/download-artifact@v4
        with:
          name: mapa-procesos-rama-hardware
          path: docs/
      - name: Agregar este proceso
        run: |
          cat <<'EOF' >> docs/mapa-procesos-rama-hardware.md
          ### Proceso: Desarrollo de firmware

          - **Entradas:** Esquemático y BOM aprobados (proceso anterior); requisitos funcionales de sensado/actuación
          - **Actividades:** Programación del microcontrolador, implementación de drivers de sensores, integración del protocolo de comunicación (LoRaWAN)
          - **Salidas:** Firmware compilado y versionado; documentación de pines y del protocolo usado
          - **Recursos:** IDE de firmware (Arduino), kit de desarrollo del microcontrolador, especificación del protocolo elegido

          EOF
      - name: Subir artifact
        uses: actions/upload-artifact@v4
        with:
          name: mapa-procesos-rama-hardware
          path: docs/mapa-procesos-rama-hardware.md
          overwrite: true

  rama_hardware_pruebas:
    name: "Pruebas de integración hardware"
    needs: rama_hardware_firmware
    runs-on: ubuntu-latest
    steps:
      - name: Descargar artifact
        uses: actions/download-artifact@v4
        with:
          name: mapa-procesos-rama-hardware
          path: docs/
      - name: Agregar este proceso
        run: |
          cat <<'EOF' >> docs/mapa-procesos-rama-hardware.md
          ### Proceso: Pruebas de integración hardware

          - **Entradas:** Prototipo de placa (proceso 1); firmware compilado (proceso 2)
          - **Actividades:** Pruebas de banco (consumo eléctrico, rango de sensado, estabilidad de la comunicación), ajustes de calibración
          - **Salidas:** Reporte de pruebas de hardware; lista de defectos y ajustes de calibración
          - **Recursos:** Banco de pruebas, multímetro/osciloscopio, dispositivo prototipo

          EOF
      - name: Subir artifact
        uses: actions/upload-artifact@v4
        with:
          name: mapa-procesos-rama-hardware
          path: docs/mapa-procesos-rama-hardware.md
          overwrite: true

  # ===================================================================
  # RAMA SOFTWARE / BACKEND — 2 procesos (rama más corta: no necesita
  # tener el mismo número de procesos que la rama Hardware). El primero
  # también depende de "requisitos" y crea el documento de su propia
  # rama.
  # ===================================================================
  rama_software_api:
    name: "API y backend de ingesta"
    needs: requisitos
    runs-on: ubuntu-latest
    steps:
      - name: Crear documento de la rama
        run: |
          mkdir -p docs
          cat <<'EOF' > docs/mapa-procesos-rama-software.md
          ## Rama Software / Backend

          EOF
      - name: Agregar este proceso
        run: |
          cat <<'EOF' >> docs/mapa-procesos-rama-software.md
          ### Proceso: Desarrollo de API y backend de ingesta de datos

          - **Entradas:** Protocolo de comunicación acordado con el equipo de Hardware (decisión de diseño temprana, no una dependencia de CI); requisitos de interfaz (Paso 2)
          - **Actividades:** Diseño del endpoint de ingesta, implementación del backend, definición del esquema de la base de datos de telemetría
          - **Salidas:** API de ingesta desplegada en entorno de pruebas; esquema de base de datos
          - **Recursos:** Framework backend elegido por el equipo, base de datos de series de tiempo, entorno de pruebas

          EOF
      - name: Subir artifact
        uses: actions/upload-artifact@v4
        with:
          name: mapa-procesos-rama-software
          path: docs/mapa-procesos-rama-software.md
          overwrite: true

  rama_software_dashboard:
    name: "Dashboard de monitoreo"
    needs: rama_software_api
    runs-on: ubuntu-latest
    steps:
      - name: Descargar artifact
        uses: actions/download-artifact@v4
        with:
          name: mapa-procesos-rama-software
          path: docs/
      - name: Agregar este proceso
        run: |
          cat <<'EOF' >> docs/mapa-procesos-rama-software.md
          ### Proceso: Desarrollo del dashboard de monitoreo

          - **Entradas:** API de ingesta (proceso anterior); requisitos funcionales de visualización (Paso 2)
          - **Actividades:** Diseño de las vistas de monitoreo, consumo de la API, despliegue del dashboard
          - **Salidas:** Dashboard funcional en entorno de pruebas
          - **Recursos:** Framework frontend elegido por el equipo, librería de gráficos

          EOF
      - name: Subir artifact
        uses: actions/upload-artifact@v4
        with:
          name: mapa-procesos-rama-software
          path: docs/mapa-procesos-rama-software.md
          overwrite: true

  # -----------------------------------------------------------------
  # Integración y despliegue: se ejecuta cuando AMBAS ramas terminan,
  # aunque tengan distinto número de procesos. Descarga el documento de
  # consolidación (de "requisitos") y los dos documentos de rama; en un
  # step une las ramas a ese documento; en otro step, ya consolidado,
  # agrega su propia información; y recién después hace el commit/push.
  # -----------------------------------------------------------------
  consolidar:
    name: "Integración y despliegue"
    needs: [rama_hardware_pruebas, rama_software_dashboard]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Descargar artifact de consolidación
        uses: actions/download-artifact@v4
        with:
          name: mapa-procesos
          path: docs/
      - name: Descargar artifact rama Hardware
        uses: actions/download-artifact@v4
        with:
          name: mapa-procesos-rama-hardware
          path: docs/
      - name: Descargar artifact rama Software
        uses: actions/download-artifact@v4
        with:
          name: mapa-procesos-rama-software
          path: docs/
      - name: Unir ambas ramas al documento de consolidación
        run: |
          cat docs/mapa-procesos-rama-hardware.md >> docs/mapa-procesos.md
          cat docs/mapa-procesos-rama-software.md >> docs/mapa-procesos.md
      - name: Agregar este proceso
        run: |
          cat <<'EOF' >> docs/mapa-procesos.md
          ## Proceso: Integración y despliegue

          - **Entradas:** Firmware probado y reporte de pruebas de hardware (rama Hardware); dashboard funcional en entorno de pruebas (rama Software)
          - **Actividades:** Conexión del dispositivo físico al backend desplegado, validación end-to-end del flujo de datos (sensor → firmware → API → dashboard), ajustes finales de configuración
          - **Salidas:** Sistema IoT integrado y validado end-to-end
          - **Recursos:** Dispositivo prototipo, entorno de backend/dashboard desplegado, plan de pruebas de integración

          EOF
      - name: Commit y push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs(mapa-procesos): actualizar mapa de procesos (paralelo, ramas Hardware y Software consolidadas)"